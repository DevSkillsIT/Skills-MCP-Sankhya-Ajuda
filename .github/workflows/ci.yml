name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m pip install -r mcp-oracle/requirements.txt
      - run: python -m compileall -q mcp-oracle
      - run: python -m unittest discover -s mcp-oracle
      - run: python -c "import sys; sys.path.insert(0, 'mcp-oracle'); import server"
